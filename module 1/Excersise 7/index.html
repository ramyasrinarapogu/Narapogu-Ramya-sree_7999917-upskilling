<!DOCTYPE html>
<html>
<head>
    <title>Event Video Invite</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        video {
            width: 100%;
            border-radius: 10px;
            border: 3px solid #333;
        }

        #message {
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }

        .note {
            margin-top: 15px;
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Community Event Invitation Video</h2>

    <!-- Video -->
    <video id="eventVideo"
           controls
           oncanplay="videoReady()">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support video tag.
    </video>

    <!-- Message -->
    <div id="message"></div>

    <p class="note">
        ⚠ Try to refresh or close tab after interacting to see warning message.
    </p>

</div>

<script>
    // oncanplay event
    function videoReady() {
        document.getElementById("message").innerHTML =
            "🎥 Video ready to play!";
    }

    // onbeforeunload warning
    window.onbeforeunload = function () {
        return "You have not finished watching or interacting with the page. Are you sure you want to leave?";
    };
</script>

</body>
</html>
