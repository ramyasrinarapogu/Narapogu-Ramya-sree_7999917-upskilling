<!DOCTYPE html>
<html>
<head>
    <title>DevTools Debugging Demo</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        .box {
            width: 300px;
            height: 150px;
            margin: auto;
            margin-top: 50px;
            background-color: lightblue;
            line-height: 150px;
            font-size: 20px;
            border-radius: 10px;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 200px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>DevTools Debugging Practice</h2>

<div class="box" id="myBox">
    Hover / Inspect Me
</div>

<button onclick="changeStyle()">Change Style</button>

<script>
    console.log("Page loaded successfully ✔");

    let count = 0;

    function changeStyle() {

        console.log("Button clicked ✔");

        let box = document.getElementById("myBox");

        count++;
        console.log("Click count:", count); // debugging variable

        // BUG EXAMPLE: intentional issue for debugging practice
        if (count % 2 == 0) {
            box.style.backgroundColor = "orange";
            box.innerHTML = "Even Click";
        } else {
            box.style.backgroundColor = "lightgreen";
            box.innerHTML = "Odd Click";
        }
    }
</script>

</body>
</html>
