<!DOCTYPE html>
<html>
<head>
    <title>Community Events Gallery</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
        }

        h2 {
            color: darkblue;
            margin: 20px 0;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        td {
            padding: 12px;
        }

        .event-img {
            width: 260px;
            height: 180px;
            object-fit: cover;
            border: 4px solid #333;
            border-radius: 10px;
        }

        .caption {
            margin-top: 6px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>

<body>

    <h2>Community Events Gallery</h2>

    <table>

        <!-- Row 1 -->
        <tr>
            <td>
                <img class="event-img" src="01.webp" alt="Tree Plantation Drive" title="Tree Plantation Drive">
                <div class="caption">Tree Plantation Drive</div>
            </td>

            <td>
                <img class="event-img" src="02.webp" alt="Clean City Campaign" title="Clean City Campaign">
                <div class="caption">Clean City Campaign</div>
            </td>

            <td>
                <img class="event-img" src="03.webp" alt="Food Donation Drive" title="Food Donation Drive">
                <div class="caption">Food Donation Drive</div>
            </td>
        </tr>

        <!-- Row 2 -->
        <tr>
            <td>
                <img class="event-img" src="04.webp" alt="Blood Donation Camp" title="Blood Donation Camp">
                <div class="caption">Blood Donation Camp</div>
            </td>

            <td>
                <img class="event-img" src="05.webp" alt="Community Sports Meet" title="Community Sports Meet">
                <div class="caption">Community Sports Meet</div>
            </td>

            <td>
                <img class="event-img" src="06.webp" alt="Cultural Festival" title="Cultural Festival">
                <div class="caption">Cultural Festival</div>
            </td>
        </tr>

    </table>

</body>
</html>
