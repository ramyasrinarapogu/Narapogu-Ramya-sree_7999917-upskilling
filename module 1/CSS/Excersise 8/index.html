<!DOCTYPE html>
<html>
<head>
  <title>Box Model Example</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>Event Cards</h1>

  <!-- Event Cards -->
  <div class="eventCard">
    <h3>Tech Conference</h3>
    <p>This event covers latest technologies and innovations.</p>
  </div>

  <div class="eventCard">
    <h3>Music Festival</h3>
    <p>Enjoy live music performances from top artists.</p>
  </div>

  <!-- Visibility Demo -->
  <div class="hidden-box">I am visibility: hidden</div>
  <div class="none-box">I am display: none</div>

  <!-- Form -->
  <h2>Register</h2>
  <form>
    <input type="text" placeholder="Enter Name" class="input-field"><br><br>
    <input type="email" placeholder="Enter Email" class="input-field"><br><br>
    <button type="submit">Submit</button>
  </form>

</div>

</body>
</html>
