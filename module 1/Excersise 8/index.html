<!DOCTYPE html>
<html>
<head>
    <title>Event Preferences</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .save-btn {
            background: darkblue;
            color: white;
        }

        .clear-btn {
            background: red;
            color: white;
        }

        #msg {
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Save Your Event Preference</h2>

    <!-- Event dropdown -->
    <select id="eventSelect" onchange="savePreference()">
        <option value="">-- Select Event --</option>
        <option value="Tree Plantation">Tree Plantation</option>
        <option value="Clean City Drive">Clean City Drive</option>
        <option value="Food Donation">Food Donation</option>
        <option value="Blood Donation">Blood Donation</option>
        <option value="Sports Meet">Sports Meet</option>
        <option value="Cultural Festival">Cultural Festival</option>
    </select>

    <div id="msg"></div>

    <!-- Clear button -->
    <button class="clear-btn" onclick="clearPreferences()">
        Clear Preferences
    </button>

</div>

<script>

    // Save selected event in localStorage
    function savePreference() {
        let event = document.getElementById("eventSelect").value;

        localStorage.setItem("preferredEvent", event);

        // (optional) session storage example
        sessionStorage.setItem("lastSelectedEvent", event);

        document.getElementById("msg").innerHTML =
            "Saved: " + event;
    }

    // Load saved preference on page load
    window.onload = function () {
        let savedEvent = localStorage.getItem("preferredEvent");

        if (savedEvent) {
            document.getElementById("eventSelect").value = savedEvent;

            document.getElementById("msg").innerHTML =
                "Loaded saved preference: " + savedEvent;
        }
    };

    // Clear both storages
    function clearPreferences() {
        localStorage.removeItem("preferredEvent");
        sessionStorage.clear();

        document.getElementById("eventSelect").value = "";
        document.getElementById("msg").innerHTML =
            "Preferences cleared ✔";
    }

</script>

</body>
</html>
