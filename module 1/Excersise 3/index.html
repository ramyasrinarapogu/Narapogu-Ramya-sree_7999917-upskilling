<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Banner</title>

    <!-- 🔹 Internal CSS -->
    <style>
        /* ID styling */
        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin: 20px;
        }

        /* Class styling */
        .highlight {
            background-color: yellow;
            font-weight: bold;
            padding: 5px;
        }
    </style>
</head>

<body>

    <!-- 🔹 Welcome Banner -->
    <div id="welcomeBanner">
        <h1>Welcome Back, User! 🎉</h1>

        <p>
            We are happy to see you again. Check out our 
            <span style="color: red; font-weight: bold;">
                Special Offer!
            </span>
        </p>

        <p class="highlight">
            Register now to get early access to events!
        </p>
    </div>

</body>
</html>
